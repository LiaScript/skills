# Overview page with own design, tag filter, search and downloads.
# Build:  liaex -i project.yaml -f project -o index --project-search \
#           --project-generate-scorm12 --project-generate-xapi --project-generate-pdf
# Publish the output folder (index.html, assets/, the copied theme.css) and
# images this file references relatively — see deploy-project.yml.

title: LiaScript Templates
comment: Interaktive Erweiterungen für LiaScript-Kurse – zum Ausprobieren, Herunterladen und Einbinden ins LMS.
logo: https://live.staticflickr.com/7327/11125348744_2a75b75427_b.jpg   # header background
icon: https://liascript.github.io/favicon.ico

navbar:
  brand: LiaTemplates
  background: "#1f2933"
  theme: dark
  links:
    - label: LiaScript
      url: https://liascript.github.io
    - label: GitHub
      url: https://github.com/LiaTemplates

# design: stylesheets and CSS in <head> after Bootstrap; theme.css is copied next to the page
link: theme.css
style: |
  /* change the theme's variables here, e.g. university colors: */
  /* :root { --accent: #003366; --accent-dark: #001f3f; --hero-from: rgba(0,51,102,.93); --hero-to: rgba(201,162,39,.55); } */

footer: >
  Made with <a href="https://liascript.github.io">LiaScript</a> · Inhalte unter CC BY 4.0

collection:
  - url: https://raw.githubusercontent.com/LiaTemplates/ABCjs/main/README.md
    tags: [Musik]
  - url: https://raw.githubusercontent.com/LiaTemplates/Algebrite/master/README.md
    tags: [Mathematik]

  - title: Zusammenarbeit & Grafik
    comment: Templates für gemeinsames Arbeiten und Geometrie
    grid: true
    collection:
      - url: https://raw.githubusercontent.com/LiaTemplates/JSXGraph/main/README.md
        tags: [Mathematik, Grafik]
      - url: https://raw.githubusercontent.com/LiaTemplates/CollaborativeDrawing/main/README.md
        tags: [Klassenraum]
        # no logo in its header: the card gets no image (theme.css adds a color bar);
        # set `logo: https://…` here to give it one
