# Build multiple project pages from separate YAML files in a project/ subdirectory,
# generate PDFs and SCORM packages for each, then deploy everything to GitHub Pages.
#
# Repository layout expected:
#   project/
#     index.yaml              ← top-level navigation page (links to sub-sites)
#     topic-a.yaml            ← one topic/audience/subject area
#     topic-b.yaml
#     topic-c.yaml
#   assets/                   ← shared images/CSS referenced by project pages
#
# Real-world reference: https://github.com/Ifi-DiAgnostiK-Project/demo
#
# Place this file at: .github/workflows/deploy.yml

name: Deploy Multi-Project Website

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 0"   # also rebuild every Sunday at 03:00 UTC

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # liaex --format project writes ./assets/<format>/ (generated downloads) and
      # ./tmp/ (repo clones) into its working directory, so all exports run inside
      # this directory outside the repository. A fixed path allows caching.
      SITE_DIR: /tmp/lia-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install LiaScript Exporter
        run: npm install -g @liascript/exporter

      - name: Prepare site directory and cache week
        id: week
        run: |
          mkdir -p "$SITE_DIR"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore generated downloads
        uses: actions/cache@v4
        with:
          path: /tmp/lia-site/assets
          # --project-generate-cache never refreshes an existing file; rotating the
          # key weekly picks up content changes in the courses.
          key: lia-assets-${{ hashFiles('project/*.yaml') }}-${{ steps.week.outputs.week }}

      - name: Install Chromium system dependencies (required for PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libpango-1.0-0 libcairo2 libasound2t64 libnss3 libnspr4 \
            fonts-liberation ca-certificates wget

      - name: Generate all project pages
        working-directory: /tmp/lia-site
        env:
          # Required for Puppeteer inside GitHub Actions (no sandbox needed in CI)
          PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"
          SRC: ${{ github.workspace }}/project
        run: |
          # Top-level index page — no PDF/SCORM needed here
          liaex -f project -i "$SRC/index.yaml" -o index

          # Per-topic pages with PDF and SCORM generation + full-text search.
          # All pages share ./assets/ here; identical courses are generated once.
          liaex -f project -i "$SRC/topic-a.yaml" -o topic-a \
            --project-search --project-generate-pdf --project-generate-scorm12 \
            --project-generate-cache

          liaex -f project -i "$SRC/topic-b.yaml" -o topic-b \
            --project-search --project-generate-pdf --project-generate-scorm12 \
            --project-generate-cache

          liaex -f project -i "$SRC/topic-c.yaml" -o topic-c \
            --project-search --project-generate-pdf --project-generate-scorm12 \
            --project-generate-cache

          # Add further topic YAML files by duplicating the block above.
          # Use --project-generate-scorm2004 instead of --project-generate-scorm12
          # when targeting ILIAS or scorm.cloud.
          # If several courses share one repository, add `path: <course-folder>`
          # to each entry so SCORM packages don't contain the whole repository.

      - name: Prepare deployment directory
        run: |
          mkdir -p gh-pages-deploy

          # Generated HTML pages
          cp "$SITE_DIR"/*.html gh-pages-deploy/

          # Generated downloads (PDF/SCORM). The pages link to assets/<format>/<hash>.*,
          # so this folder must sit next to the HTML files.
          cp -r "$SITE_DIR/assets" gh-pages-deploy/

          # Shared images/CSS from the repository referenced by the project pages
          if [ -d assets ]; then cp -r assets/. gh-pages-deploy/assets/; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-deploy
          force_orphan: true   # always replace gh-pages history completely
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"

      - name: Output deployed URL
        run: |
          echo "✅ Deployed successfully!"
          echo "URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
